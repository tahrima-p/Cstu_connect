  <path d="M250 150 C214 122 160 116 104 128 L104 332 C160 320 214 328 250 358 Z" fill="url(#left)"/>
  <path d="M262 150 C298 122 352 116 408 128 L408 332 C352 320 298 328 262 358 Z" fill="url(#right)"/>

